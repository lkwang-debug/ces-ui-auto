[pytest]
testpaths = ./testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --alluredir=allure-results
    --clean-alluredir
markers =
    smoke: critical path tests suitable for a quick environment check
    regression: normal functional and validation regression tests
    security: authentication, authorization, and access-control tests
    destructive: high-risk tests excluded by run.py unless explicitly enabled
    extended: deep boundary matrix and long-running verification, executed by run.py --full
    requires_capability(name): run only when the detected build supports and the login account is authorized for this feature
    requires_profile(name): collect only for the named detected product profile

